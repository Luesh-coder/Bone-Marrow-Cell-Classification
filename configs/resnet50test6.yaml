# resnet50test6: strong augmentation for all classes
# Tuning Plan A6 in results/resnet50_results.xlsx (priority: 2).
#
# Same as resnet50test1 except:
#   aug: medium -> strong
#
# Why:  Train loss was still falling when training stopped while val loss rose (mild
#       overfitting). strong = medium + colour jitter +/-30%, zoom 0.9-1.1x and an
#       occasional mild blur.
# Compare its validation macro-F1 with test 1, not with the untuned run.
#
# bmenv\Scripts\python scripts/train.py --config configs/resnet50test6.yaml
name: resnet50test6
model: resnet50
pretrained: true
unfreeze: all            # head | last_block | all
dropout: 0.3

image_size: 224
aug: strong              # CHANGED (was medium)

epochs: 12               # from test 1 (was 20 in resnet50.yaml)
patience: 12             # from test 1 (was 4 in resnet50.yaml)
batch_size: 64
optimizer: adamw
lr: 3.0e-4
backbone_lr_mult: 0.1
weight_decay: 1.0e-4
scheduler: cosine
warmup_epochs: 1.0

loss: weighted_ce
class_weight_scheme: inv_sqrt
sampler: none

num_workers: 6           # from test 1 (was 12 in resnet50.yaml)
seed: 42
