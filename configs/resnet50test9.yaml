# resnet50test9: balanced sampler instead of loss weights
# Tuning Plan A8 in results/resnet50_results.xlsx (priority: 2).
#
# Same as resnet50test1 except:
#   sampler: none -> weighted
#   loss: weighted_ce -> ce
#
# Why:  Proposal slide 9, option 2 (balanced sampling). The loss switches to plain ce so
#       the imbalance correction is not applied twice: count^-0.5 sampling x inv_sqrt
#       weights (count^-0.5) would equal count^-1, the very aggressive 'inverse' scheme
#       (~3,900:1).
# Note: With loss: ce, class_weight_scheme is ignored.
# Compare its validation macro-F1 with test 1, not with the untuned run.
#
# bmenv\Scripts\python scripts/train.py --config configs/resnet50test9.yaml
name: resnet50test9
model: resnet50
pretrained: true
unfreeze: all            # head | last_block | all
dropout: 0.3

image_size: 224
aug: medium

epochs: 12               # from test 1 (was 20 in resnet50.yaml)
patience: 12             # from test 1 (was 4 in resnet50.yaml)
batch_size: 64
optimizer: adamw
lr: 3.0e-4
backbone_lr_mult: 0.1
weight_decay: 1.0e-4
scheduler: cosine
warmup_epochs: 1.0

loss: ce                 # CHANGED (was weighted_ce)
class_weight_scheme: inv_sqrt  # ignored with loss: ce
sampler: weighted        # CHANGED (was none)
sampler_power: 0.5       # default, stated explicitly

num_workers: 6           # from test 1 (was 12 in resnet50.yaml)
seed: 42
