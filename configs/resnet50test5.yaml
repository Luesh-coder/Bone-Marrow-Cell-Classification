# resnet50test5: strong augmentation for rare classes only
# Tuning Plan A5 in results/resnet50_results.xlsx (priority: 2).
#
# Same as resnet50test1 except:
#   rare_aug: null -> strong
#
# Why:  Proposal slide 9, option 3 (targeted augmentation). Applies to the 7 classes with
#       fewer than rare_threshold = 500 train images (BAS, HAC, OTH, LYI, FGC, KSC, ABE),
#       which score 0.00-0.82 F1. Every other class keeps the medium preset.
# Compare its validation macro-F1 with test 1, not with the untuned run.
#
# bmenv\Scripts\python scripts/train.py --config configs/resnet50test5.yaml
name: resnet50test5
model: resnet50
pretrained: true
unfreeze: all            # head | last_block | all
dropout: 0.3

image_size: 224
aug: medium
rare_aug: strong         # CHANGED (was null)

epochs: 12               # from test 1 (was 20 in resnet50.yaml)
patience: 12             # from test 1 (was 4 in resnet50.yaml)
batch_size: 64
optimizer: adamw
lr: 3.0e-4
backbone_lr_mult: 0.1
weight_decay: 1.0e-4
scheduler: cosine
warmup_epochs: 1.0

loss: weighted_ce
class_weight_scheme: inv_sqrt
sampler: none

num_workers: 6           # from test 1 (was 12 in resnet50.yaml)
seed: 42
